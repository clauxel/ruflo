name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ruflo-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy my-ruflo
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout my_ruflo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID as a repository secret."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] && { [ -z "${CLOUDFLARE_API_KEY}" ] || [ -z "${CLOUDFLARE_EMAIL}" ]; }; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, or set both CLOUDFLARE_API_KEY and CLOUDFLARE_EMAIL as repository secrets."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build Worker assets
        run: npm run build:worker

      - name: Apply D1 migrations
        run: npm run cloudflare:d1:migrate

      - name: Deploy Worker
        run: npm run cloudflare:worker:deploy
